services:
  api:
    build: .
    env_file:
      - /srv/apps/nesta-server/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    env_file:
      - /srv/apps/nesta-server/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data