name: Deploy Nesta

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhumabekovalim/nesta

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zhumabekovalim/nesta:latest
            ghcr.io/zhumabekovalim/nesta:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            cd /srv/apps/nesta-server

            if [ ! -f .env ]; then
            cat > .env << 'EOF' 
            ${{ secrets.APP_ENV }}
            EOF
            chmod 600 .env
            echo ".env created"
            else
            echo ".env exists, skip overwrite"
            fi

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u zhumabekovalim --password-stdin

            # Pull and recreate ONLY what needs update
            docker compose pull api
            docker compose up -d --force-recreate --remove-orphans

            docker image prune -f
